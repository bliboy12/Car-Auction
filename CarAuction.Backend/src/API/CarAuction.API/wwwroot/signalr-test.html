<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>SignalR Test — Auction Hub</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <style>
        body { font-family: monospace; background: #111; color: #0f0; padding: 20px; }
        input { width: 400px; padding: 6px; margin: 4px 0; }
        button { padding: 6px 12px; margin: 4px; }
        #log { white-space: pre-wrap; background: #000; padding: 10px; margin-top: 10px; height: 300px; overflow-y: auto; border: 1px solid #333; }
    </style>
</head>
<body>
    <h2>AuctionHub Test</h2>

    <div>JWT Token (from /api/auth/login):</div>
    <input id="token" placeholder="paste token here" />

    <div>Auction ID:</div>
    <input id="auctionId" placeholder="paste auction id here" />

    <br />
    <button onclick="connect()">Connect</button>
    <button onclick="joinGroup()">Join Auction Group</button>
    <button onclick="leaveGroup()">Leave Auction Group</button>

    <div id="log"></div>

    <script>
        let connection;

        function log(msg) {
            const el = document.getElementById("log");
            el.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
            el.scrollTop = el.scrollHeight;
        }

        async function connect() {
            if (connection) {
                await connection.stop();
                log("stopped previous connection.");
            }
            const token = document.getElementById("token").value;

            connection = new signalR.HubConnectionBuilder()
                .withUrl("/hubs/auction", { accessTokenFactory: () => token })
                .withAutomaticReconnect()
                .build();

            connection.on("BidPlaced", (notification) => {
                log("BidPlaced received: " + JSON.stringify(notification, null, 2));
            });

            connection.on("AuctionActivated", (notification) => {
                log(notification);
            })

            connection.on("AuctionClosed", (notification) => {
                log("Auction has been closed: " + JSON.stringify(notification, null, 2))
            })

            connection.onclose(() => log("Connection closed."));

            try {
                await connection.start();
                log("Connected. Connection ID: " + connection.connectionId);
            } catch (err) {
                log("Connection failed: " + err);
            }
        }

        async function joinGroup() {
            const auctionId = document.getElementById("auctionId").value;
            if (!connection) { log("Connect first."); return; }
            await connection.invoke("JoinAuctionGroup", auctionId);
            log("Joined group for auction " + auctionId);
        }

        async function leaveGroup() {
            const auctionId = document.getElementById("auctionId").value;
            if (!connection) { log("Connect first."); return; }
            await connection.invoke("LeaveAuctionGroup", auctionId);
            log("Left group for auction " + auctionId);
        }
    </script>
</body>
</html>
